<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#1e1828"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#hotelBg)"/>

  <!-- Browser Window -->
  <rect x="25" y="25" width="550" height="330" rx="16" fill="#0f0f14" stroke="#2a2536" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="38" rx="16" fill="#1b1724"/>
  <circle cx="48" cy="44" r="5" fill="#ef4444"/>
  <circle cx="65" cy="44" r="5" fill="#eab308"/>
  <circle cx="82" cy="44" r="5" fill="#22c55e"/>

  <rect x="110" y="33" width="370" height="22" rx="6" fill="#110f17"/>
  <text x="125" y="48" fill="#d4af37" font-family="monospace" font-size="11">https://grandluxe-hotel.com/reservations</text>

  <!-- Navigation -->
  <rect x="45" y="75" width="510" height="42" rx="8" fill="#1a1823"/>
  <text x="60" y="101" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="15">🏨 GRAND LUXE HOTEL &amp; SUITES</text>
  <text x="310" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Suites</text>
  <text x="365" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Dining</text>
  <rect x="440" y="83" width="105" height="26" rx="6" fill="url(#goldGrad)"/>
  <text x="492" y="100" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Book Room</text>

  <!-- Hero Banner with Hotel Luxury Theme -->
  <g transform="translate(45, 130)">
    <rect width="510" height="120" rx="12" fill="#1a1526" stroke="#372d4a" stroke-width="1"/>
    
    <text x="30" y="45" fill="#fef08a" font-family="serif" font-size="22" font-weight="bold">Experience Royal Comfort &amp; Luxury</text>
    <text x="30" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="11">Online Booking Engine • Instant WhatsApp Confirmation • Admin Room Calendar</text>

    <!-- Booking Form Bar inside site -->
    <rect x="30" y="86" width="450" height="24" rx="6" fill="#282236"/>
    <text x="45" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">📅 Check In: 15 Nov</text>
    <text x="160" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">📅 Check Out: 18 Nov</text>
    <text x="280" y="102" fill="#94a3b8" font-family="sans-serif" font-size="9">👥 2 Adults • 1 Deluxe</text>
    <rect x="385" y="88" width="90" height="20" rx="4" fill="#fbbf24"/>
    <text x="430" y="102" fill="#000000" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Check Availability</text>
  </g>

  <!-- Bottom Admin Suite Features -->
  <g transform="translate(45, 265)">
    <rect width="160" height="75" rx="8" fill="#181522" stroke="#4c1d95" stroke-width="1"/>
    <text x="15" y="24" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">🏨 ROOM MANAGEMENT</text>
    <text x="15" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9">Real-time room availability</text>
    <text x="15" y="60" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="bold">32 / 36 Occupied</text>

    <rect x="175" width="160" height="75" rx="8" fill="#181522" stroke="#4c1d95" stroke-width="1"/>
    <text x="190" y="24" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">📍 GOOGLE MAPS &amp; SEO</text>
    <text x="190" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9">High local search visibility</text>
    <text x="190" y="60" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">#1 Ranked Locally</text>

    <rect x="350" width="160" height="75" rx="8" fill="#181522" stroke="#4c1d95" stroke-width="1"/>
    <text x="365" y="24" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="bold">💬 WHATSAPP DIRECT</text>
    <text x="365" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9">Guests book in 1-click</text>
    <text x="365" y="60" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Instant Lead Alert</text>
  </g>
</svg>
