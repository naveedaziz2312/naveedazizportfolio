<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="flutterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526"/>
      <stop offset="100%" stop-color="#032b43"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="50%" stop-color="#0175C2"/>
      <stop offset="100%" stop-color="#13B9FD"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#flutterBg)"/>

  <!-- Left: Mobile Device Frame -->
  <g transform="translate(60, 25)">
    <!-- Phone Body -->
    <rect width="180" height="330" rx="28" fill="#0b1320" stroke="#0175C2" stroke-width="2.5"/>
    <!-- Speaker & Camera notch -->
    <rect x="60" y="8" width="60" height="12" rx="6" fill="#1e293b"/>
    <circle cx="108" cy="14" r="3" fill="#334155"/>

    <!-- Screen Content -->
    <g transform="translate(10, 26)">
      <!-- Status Bar -->
      <text x="10" y="14" fill="#94a3b8" font-family="sans-serif" font-size="8">9:41 AM</text>
      <text x="135" y="14" fill="#94a3b8" font-family="sans-serif" font-size="8">5G 🔋</text>

      <!-- App Bar -->
      <rect y="22" width="160" height="36" rx="6" fill="#0f2942"/>
      <text x="10" y="44" fill="#13B9FD" font-family="sans-serif" font-size="11" font-weight="bold">🍔 QuickBite Delivery</text>

      <!-- Banner -->
      <rect y="64" width="160" height="60" rx="8" fill="url(#cyanBlue)"/>
      <text x="12" y="88" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900">50% OFF TODAY</text>
      <text x="12" y="104" fill="#e0f2fe" font-family="sans-serif" font-size="8">Use code: FIRSTBITE</text>

      <!-- Categories -->
      <rect y="132" width="46" height="30" rx="6" fill="#1e3a5f"/>
      <text x="23" y="152" font-size="14" text-anchor="middle">🍕</text>

      <rect x="56" y="132" width="46" height="30" rx="6" fill="#1e3a5f"/>
      <text x="79" y="152" font-size="14" text-anchor="middle">🍔</text>

      <rect x="112" y="132" width="46" height="30" rx="6" fill="#1e3a5f"/>
      <text x="135" y="152" font-size="14" text-anchor="middle">🥤</text>

      <!-- Card item -->
      <rect y="170" width="160" height="55" rx="8" fill="#0f2942"/>
      <text x="10" y="190" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold">Crispy Zinger Burger</text>
      <text x="10" y="206" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold">Rs. 520 • 20 mins</text>
      <rect x="110" y="185" width="40" height="22" rx="4" fill="#10b981"/>
      <text x="130" y="200" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Add</text>

      <!-- Bottom Nav Bar -->
      <rect y="235" width="160" height="35" rx="6" fill="#0b1728"/>
      <text x="25" y="256" font-size="12" text-anchor="middle">🏠</text>
      <text x="65" y="256" font-size="12" text-anchor="middle">🔍</text>
      <text x="105" y="256" font-size="12" text-anchor="middle">🛒</text>
      <text x="140" y="256" font-size="12" text-anchor="middle">👤</text>
    </g>

    <!-- Bottom Home Bar -->
    <rect x="50" y="318" width="80" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Right: Technical Capabilities & Flutter Architecture -->
  <g transform="translate(275, 45)">
    <!-- Badge -->
    <rect width="130" height="26" rx="6" fill="#0175C2" opacity="0.3"/>
    <text x="65" y="18" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FLUTTER &amp; DART</text>

    <text x="0" y="60" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Cross-Platform iOS &amp; Android</text>
    <text x="0" y="82" fill="#94a3b8" font-family="sans-serif" font-size="11">Single codebase delivering native 60fps performance</text>

    <!-- Tech features grid -->
    <g transform="translate(0, 100)">
      <rect width="280" height="42" rx="8" fill="#0f223c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="15" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Supabase &amp; Firebase Realtime</text>

      <g transform="translate(0, 52)">
        <rect width="280" height="42" rx="8" fill="#0f223c" stroke="#1e3a5f" stroke-width="1"/>
        <text x="15" y="26" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">🔔 Push Notifications &amp; Live Tracking</text>
      </g>

      <g transform="translate(0, 104)">
        <rect width="280" height="42" rx="8" fill="#0f223c" stroke="#1e3a5f" stroke-width="1"/>
        <text x="15" y="26" fill="#a855f7" font-family="sans-serif" font-size="12" font-weight="bold">📱 Clean State Management (Bloc / Riverpod)</text>
      </g>

      <g transform="translate(0, 156)">
        <rect width="280" height="42" rx="8" fill="#0f223c" stroke="#1e3a5f" stroke-width="1"/>
        <text x="15" y="26" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">💳 Online Payments (Stripe / JazzCash / Cod)</text>
      </g>
    </g>
  </g>
</svg>
