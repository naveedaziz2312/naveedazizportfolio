<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="50" x2="500" y2="500"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="250" cy="220" r="140" fill="url(#glowGrad)" filter="url(#neonGlow)" opacity="0.4"/>
  <circle cx="380" cy="120" r="60" fill="#00f0ff" filter="url(#neonGlow)" opacity="0.25"/>
  <circle cx="120" cy="380" r="70" fill="#a855f7" filter="url(#neonGlow)" opacity="0.3"/>

  <!-- Futuristic Hologram Circles -->
  <circle cx="250" cy="230" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="250" cy="230" r="185" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 16" opacity="0.4"/>

  <!-- Developer Silhouette with Tech Aura -->
  <!-- Shoulders & Torso -->
  <path d="M140 430 C140 350, 180 320, 250 320 C320 320, 360 350, 360 430 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Hoodie / Collar -->
  <path d="M205 320 L250 380 L295 320 Z" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
  <path d="M230 335 L250 410 L270 335" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Neck -->
  <rect x="232" y="270" width="36" height="50" rx="8" fill="#e2e8f0"/>

  <!-- Head & Hair -->
  <ellipse cx="250" cy="205" rx="55" ry="68" fill="#f8fafc"/>
  
  <!-- Stylish Modern Hair -->
  <path d="M190 190 C185 130, 240 100, 305 120 C315 150, 310 180, 305 200 C290 150, 230 140, 190 190 Z" fill="#0f172a"/>
  
  <!-- Modern Tech Glasses / Developer Specs -->
  <rect x="205" y="190" width="38" height="24" rx="6" fill="#0b132b" stroke="#00f0ff" stroke-width="2.5"/>
  <rect x="257" y="190" width="38" height="24" rx="6" fill="#0b132b" stroke="#00f0ff" stroke-width="2.5"/>
  <line x1="243" y1="202" x2="257" y2="202" stroke="#00f0ff" stroke-width="2.5"/>
  <!-- Glasses Reflection -->
  <line x1="210" y1="195" x2="225" y2="209" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <line x1="262" y1="195" x2="277" y2="209" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>

  <!-- Confident Smile -->
  <path d="M235 240 Q250 252 265 240" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Futuristic Developer Headset -->
  <path d="M185 205 C185 135, 315 135, 315 205" fill="none" stroke="#a855f7" stroke-width="4"/>
  <rect x="180" y="195" width="12" height="30" rx="6" fill="#8b5cf6"/>
  <rect x="308" y="195" width="12" height="30" rx="6" fill="#8b5cf6"/>
  <path d="M185 220 Q205 245 225 245" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <circle cx="227" cy="245" r="4" fill="#00f0ff"/>

  <!-- Code Floating Tags -->
  <g transform="translate(60, 120)">
    <rect width="90" height="36" rx="10" fill="#111827" stroke="#00f0ff" stroke-width="1.5" opacity="0.95"/>
    <text x="45" y="23" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;code /&gt;</text>
  </g>

  <g transform="translate(350, 140)">
    <rect width="90" height="36" rx="10" fill="#111827" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
    <text x="45" y="23" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">{ Flutter }</text>
  </g>

  <g transform="translate(70, 310)">
    <rect width="105" height="36" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <text x="52" y="23" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">⚡ FullStack</text>
  </g>

  <g transform="translate(330, 310)">
    <rect width="115" height="36" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5" opacity="0.95"/>
    <text x="57" y="23" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🚀 Web &amp; Apps</text>
  </g>

  <!-- Name Ribbon Badge -->
  <g transform="translate(100, 435)">
    <rect width="300" height="42" rx="12" fill="url(#primaryGrad)" opacity="0.95" filter="url(#neonGlow)"/>
    <text x="150" y="26" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1.5" text-anchor="middle">HAFIZ NAVEED AZIZ</text>
  </g>
</svg>
