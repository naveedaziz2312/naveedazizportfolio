<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="schoolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#0d2b45"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#schoolBg)"/>

  <!-- Browser frame -->
  <rect x="25" y="25" width="550" height="330" rx="16" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="38" rx="16" fill="#0f213d"/>
  <circle cx="48" cy="44" r="5" fill="#ef4444"/>
  <circle cx="65" cy="44" r="5" fill="#eab308"/>
  <circle cx="82" cy="44" r="5" fill="#22c55e"/>

  <rect x="110" y="33" width="370" height="22" rx="6" fill="#081426"/>
  <text x="125" y="48" fill="#7dd3fc" font-family="monospace" font-size="11">https://eduspark-academy.edu.pk/portal/login</text>

  <!-- Academy Header -->
  <rect x="45" y="75" width="510" height="42" rx="8" fill="#132b4a"/>
  <text x="60" y="101" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="15">🎓 EDUSPARK ACADEMY</text>
  <text x="245" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Courses</text>
  <text x="310" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Admissions</text>
  <text x="390" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Fee Portal</text>
  <rect x="460" y="83" width="80" height="26" rx="6" fill="url(#blueGrad)"/>
  <text x="500" y="100" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Apply Online</text>

  <!-- LMS Main Section -->
  <g transform="translate(45, 130)">
    <!-- Sidebar -->
    <rect width="130" height="210" rx="8" fill="#0f223c"/>
    <text x="15" y="30" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">LMS PORTAL</text>
    
    <rect x="10" y="45" width="110" height="26" rx="6" fill="#1e3a5f"/>
    <text x="20" y="62" fill="#ffffff" font-family="sans-serif" font-size="10">📌 Dashboard</text>

    <text x="20" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">📚 Students (450+)</text>
    <text x="20" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">📝 Attendance</text>
    <text x="20" y="155" fill="#94a3b8" font-family="sans-serif" font-size="10">💳 Fee Vouchers</text>
    <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="10">📊 Exam Results</text>

    <!-- Main Content Area -->
    <g transform="translate(145, 0)">
      <!-- KPI Cards -->
      <rect width="110" height="60" rx="8" fill="#132b4a"/>
      <text x="15" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9">Active Students</text>
      <text x="15" y="48" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">1,240</text>

      <rect x="125" width="110" height="60" rx="8" fill="#132b4a"/>
      <text x="140" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9">Fee Collected</text>
      <text x="140" y="48" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold">94.2%</text>

      <rect x="250" width="115" height="60" rx="8" fill="#132b4a"/>
      <text x="265" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9">SMS Notification</text>
      <text x="265" y="48" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="bold">Enabled</text>

      <!-- Student List Table Preview -->
      <rect y="75" width="365" height="135" rx="8" fill="#0f223c" stroke="#1e3a5f" stroke-width="1"/>
      <rect y="75" width="365" height="26" rx="8" fill="#1a3559"/>
      <text x="15" y="92" fill="#7dd3fc" font-family="sans-serif" font-size="9" font-weight="bold">STUDENT NAME</text>
      <text x="150" y="92" fill="#7dd3fc" font-family="sans-serif" font-size="9" font-weight="bold">CLASS / COURSE</text>
      <text x="260" y="92" fill="#7dd3fc" font-family="sans-serif" font-size="9" font-weight="bold">STATUS</text>

      <text x="15" y="120" fill="#f1f5f9" font-family="sans-serif" font-size="10">Ahmed Raza</text>
      <text x="150" y="120" fill="#94a3b8" font-family="sans-serif" font-size="10">Matric (Science)</text>
      <rect x="260" y="108" width="60" height="18" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="290" y="121" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Paid</text>

      <text x="15" y="150" fill="#f1f5f9" font-family="sans-serif" font-size="10">Zainab Fatima</text>
      <text x="150" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10">ICS Part 2</text>
      <rect x="260" y="138" width="60" height="18" rx="4" fill="#10b981" opacity="0.2"/>
      <text x="290" y="151" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Paid</text>

      <text x="15" y="180" fill="#f1f5f9" font-family="sans-serif" font-size="10">Hamza Bilal</text>
      <text x="150" y="180" fill="#94a3b8" font-family="sans-serif" font-size="10">FSc Pre-Medical</text>
      <rect x="260" y="168" width="60" height="18" rx="4" fill="#f59e0b" opacity="0.2"/>
      <text x="290" y="181" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Pending</text>
    </g>
  </g>
</svg>
