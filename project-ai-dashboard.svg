<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071a"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#241042"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#aiBg)"/>

  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="330" rx="16" fill="#100b21" stroke="#3b1d6e" stroke-width="1.5"/>
  <rect x="25" y="25" width="550" height="38" rx="16" fill="#1b1236"/>
  <circle cx="48" cy="44" r="5" fill="#ef4444"/>
  <circle cx="65" cy="44" r="5" fill="#eab308"/>
  <circle cx="82" cy="44" r="5" fill="#22c55e"/>

  <rect x="110" y="33" width="370" height="22" rx="6" fill="#0d081b"/>
  <text x="125" y="48" fill="#c084fc" font-family="monospace" font-size="11">https://nexus-ai-growth.app/smart-assistant</text>

  <!-- App Header -->
  <rect x="45" y="75" width="510" height="42" rx="8" fill="#1d123d"/>
  <text x="60" y="101" fill="#c084fc" font-family="sans-serif" font-weight="900" font-size="15">🧠 NEXUS AI FOR BUSINESS</text>
  <rect x="430" y="83" width="115" height="26" rx="6" fill="url(#neonPurple)"/>
  <text x="487" y="100" fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live AI Model Active</text>

  <!-- Split view: AI Chatbot on left, Analytics on right -->
  <g transform="translate(45, 130)">
    <!-- Chatbot Assistant -->
    <rect width="245" height="210" rx="8" fill="#160e30" stroke="#372063" stroke-width="1"/>
    <rect width="245" height="30" rx="8" fill="#201542"/>
    <text x="15" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">🤖 24/7 AI WhatsApp Auto-Reply Bot</text>

    <!-- Message bubble 1 -->
    <rect x="10" y="42" width="180" height="36" rx="6" fill="#281a54"/>
    <text x="18" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="9">Customer: Kya aaj table book ho</text>
    <text x="18" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="9">sakti he 4 persons ke liye?</text>

    <!-- Message bubble 2 (AI reply) -->
    <rect x="45" y="86" width="190" height="48" rx="6" fill="#6d28d9"/>
    <text x="53" y="100" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">AI Agent: Ji bilkul! 4 seats reserved</text>
    <text x="53" y="114" fill="#ffffff" font-family="sans-serif" font-size="9">for 8:30 PM. Order confirm karne</text>
    <text x="53" y="127" fill="#fef08a" font-family="sans-serif" font-size="8">ke liye 'YES' reply kijiye.</text>

    <!-- Message bubble 3 -->
    <rect x="10" y="142" width="130" height="24" rx="6" fill="#281a54"/>
    <text x="18" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="9">Customer: YES Confirm 👍</text>

    <!-- Bot Status -->
    <rect x="10" y="174" width="225" height="24" rx="4" fill="#0b071a"/>
    <text x="18" y="190" fill="#22c55e" font-family="sans-serif" font-size="9">⚡ Order saved to Admin Panel instantly</text>

    <!-- Right: Analytics & Predictive Chart -->
    <g transform="translate(260, 0)">
      <rect width="250" height="210" rx="8" fill="#160e30" stroke="#372063" stroke-width="1"/>
      <text x="15" y="24" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">📈 Customer Growth Forecast</text>
      
      <!-- Chart Graphic -->
      <path d="M 20 140 Q 70 120 120 90 T 220 45" fill="none" stroke="#00f0ff" stroke-width="3"/>
      <circle cx="220" cy="45" r="5" fill="#a855f7"/>

      <text x="20" y="175" fill="#94a3b8" font-family="sans-serif" font-size="10">Conversion Rate:</text>
      <text x="120" y="175" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">+340% Higher</text>

      <text x="20" y="195" fill="#94a3b8" font-family="sans-serif" font-size="10">Admin Time Saved:</text>
      <text x="125" y="195" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">15 hrs / week</text>
    </g>
  </g>
</svg>
