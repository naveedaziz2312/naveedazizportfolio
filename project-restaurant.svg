<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="restBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="restAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="url(#restBg)"/>

  <!-- Browser Chrome Bar -->
  <rect x="25" y="25" width="550" height="330" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="25" y="25" width="550" height="38" rx="16" fill="#1e293b"/>
  <circle cx="48" cy="44" r="5" fill="#ef4444"/>
  <circle cx="65" cy="44" r="5" fill="#eab308"/>
  <circle cx="82" cy="44" r="5" fill="#22c55e"/>
  
  <!-- URL Bar -->
  <rect x="110" y="33" width="380" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="125" y="48" fill="#94a3b8" font-family="monospace" font-size="11">https://foodieflow-restaurant.com/online-order</text>
  
  <!-- Admin Badge -->
  <rect x="495" y="33" width="68" height="22" rx="6" fill="#10b981" opacity="0.2"/>
  <text x="529" y="48" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ADMIN V2</text>

  <!-- Website Content Preview -->
  <!-- Top Nav inside preview -->
  <rect x="45" y="78" width="510" height="32" rx="8" fill="#1e293b" opacity="0.8"/>
  <text x="60" y="99" fill="#f97316" font-family="sans-serif" font-weight="900" font-size="14">🍕 FOODIEFLOW</text>
  <text x="210" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">Menu</text>
  <text x="260" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">Reservations</text>
  <text x="345" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="11">Deals</text>
  <rect x="455" y="84" width="85" height="20" rx="10" fill="url(#restAccent)"/>
  <text x="497" y="98" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Order Now</text>

  <!-- Hero Banner inside site -->
  <rect x="45" y="122" width="300" height="110" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="152" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Delicious Food,</text>
  <text x="65" y="174" fill="url(#restAccent)" font-family="sans-serif" font-size="16" font-weight="bold">Delivered Fast &amp; Hot.</text>
  <text x="65" y="196" fill="#94a3b8" font-family="sans-serif" font-size="10">Automated WhatsApp Ordering &amp; Live Tracking</text>
  <rect x="65" y="208" width="80" height="16" rx="8" fill="#3b82f6"/>
  <text x="105" y="219" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">View Menu</text>

  <!-- Hero Visual / Food Illustration -->
  <rect x="360" y="122" width="195" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="457" cy="177" r="42" fill="#f97316" opacity="0.15"/>
  <circle cx="457" cy="177" r="32" fill="#f97316" opacity="0.4"/>
  <text x="457" y="186" font-size="34" text-anchor="middle">🍔</text>

  <!-- Admin Panel Dashboard Overlay -->
  <g transform="translate(45, 245)">
    <rect width="510" height="95" rx="10" fill="#0b0f19" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="510" height="24" rx="10" fill="#1e1b4b"/>
    <text x="15" y="16" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="bold">📊 LIVE RESTAURANT ADMIN PANEL</text>
    <circle cx="490" cy="12" r="4" fill="#22c55e"/>
    
    <!-- Mini KPI cards -->
    <rect x="15" y="34" width="110" height="50" rx="6" fill="#1e293b"/>
    <text x="25" y="50" fill="#94a3b8" font-family="sans-serif" font-size="9">Today's Orders</text>
    <text x="25" y="72" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">142+</text>

    <rect x="140" y="34" width="110" height="50" rx="6" fill="#1e293b"/>
    <text x="150" y="50" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Revenue</text>
    <text x="150" y="72" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">Rs. 89,500</text>

    <rect x="265" y="34" width="110" height="50" rx="6" fill="#1e293b"/>
    <text x="275" y="50" fill="#94a3b8" font-family="sans-serif" font-size="9">Pending Delivery</text>
    <text x="275" y="72" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="bold">8 Orders</text>

    <rect x="390" y="34" width="105" height="50" rx="6" fill="url(#cyanGrad)"/>
    <text x="442" y="55" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Instant Print</text>
    <text x="442" y="72" fill="#e0f2fe" font-family="sans-serif" font-size="9" text-anchor="middle">Kitchen Token ⚡</text>
  </g>
</svg>
